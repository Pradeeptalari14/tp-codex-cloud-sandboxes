apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-cloud-operator
  namespace: codex-system
  labels:
    app: codex-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codex-cloud
  template:
    metadata:
      labels:
        app: codex-cloud
    spec:
      runtimeClassName: firecracker
      containers:
        - name: codex-runner
          image: ghcr.io/pradeeptalari14/codex-cloud-sandboxes:latest
          command: ["python3", "codex_cloud_runner.py"]
          resources:
            limits:
              memory: 4Gi
              cpu: "4"
            requests:
              memory: 1Gi
              cpu: "1"
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
